<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本周工作台</title>
  <style>
    :root { --bg:#f5f4ef; --surface:#fffefa; --ink:#20211f; --muted:#757871; --line:#deded5; --orange:#e8782c; --orange-soft:#fff0df; --blue:#496fd2; --blue-soft:#eaf0ff; --green:#2d9768; --green-soft:#e6f5eb; --red:#c9584d; --red-soft:#fbe9e6; --shadow:0 18px 46px rgba(35,36,31,.07); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:var(--bg); }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    button:active { transform:translateY(1px); }
    .shell { max-width:1480px; margin:0 auto; padding:30px 34px 56px; }
    .topbar { display:flex; justify-content:space-between; gap:20px; align-items:flex-start; margin-bottom:26px; }
    .eyebrow { display:flex; align-items:center; gap:8px; color:var(--orange); font-weight:700; font-size:12px; letter-spacing:.12em; }
    .eyebrow::before { content:""; width:22px; height:2px; background:var(--orange); }
    h1 { margin:8px 0 8px; font-size:clamp(30px,4vw,46px); line-height:1.05; letter-spacing:-.04em; }
    .subtitle { max-width:610px; margin:0; color:var(--muted); font-size:14px; line-height:1.65; }
    .top-actions,.week-actions,.toolbar-actions { display:flex; align-items:center; gap:9px; }
    .date-stamp { color:var(--muted); font-size:13px; white-space:nowrap; }
    .btn { display:inline-flex; justify-content:center; align-items:center; min-height:36px; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px; font-weight:600; transition:.18s ease; }
    .btn:hover { border-color:var(--orange); color:var(--orange); }
    .btn.primary { border-color:var(--ink); background:var(--ink); color:#fff; }
    .btn.primary:hover { border-color:var(--orange); background:var(--orange); color:#fff; }
    .btn.ghost { min-width:36px; padding:8px; }
    .btn.danger:hover { border-color:var(--red); color:var(--red); }
    .panel { border:1px solid var(--line); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); }
    .overview { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr); gap:18px; margin-bottom:18px; }
    .hero { min-height:220px; display:grid; grid-template-columns:minmax(210px,.9fr) minmax(240px,1.1fr); gap:24px; padding:25px 28px; position:relative; overflow:hidden; }
    .hero::after { content:""; position:absolute; width:230px; height:230px; right:-96px; bottom:-108px; border:1px solid rgba(232,120,44,.24); border-radius:50%; pointer-events:none; }
    .section-kicker { color:var(--muted); font-size:12px; letter-spacing:.08em; }
    .hero h2 { margin:9px 0 12px; font-size:24px; letter-spacing:-.025em; }
    .hero-copy { margin:0; max-width:370px; color:var(--muted); font-size:14px; line-height:1.65; }
    .person-select { display:flex; align-items:center; gap:9px; margin-top:18px; }
    label { color:var(--muted); font-size:12px; font-weight:600; }
    select,input,textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:7px; background:#fffefa; color:var(--ink); outline:none; }
    select:focus,input:focus,textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(73,111,210,.12); }
    .person-select select { width:150px; }
    .progress-wrap { align-self:center; display:grid; grid-template-columns:140px 1fr; gap:21px; align-items:center; }
    .ring { width:140px; height:140px; display:grid; place-items:center; position:relative; }
    .ring svg { position:absolute; inset:0; transform:rotate(-90deg); }
    .ring-bg { fill:none; stroke:var(--line); stroke-width:11; }
    .ring-value { fill:none; stroke:var(--orange); stroke-width:11; stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
    .ring-content { position:relative; text-align:center; }
    .ring-content strong { display:block; font-size:29px; letter-spacing:-.06em; }
    .ring-content span { color:var(--muted); font-size:12px; }
    .stats { display:grid; gap:12px; }
    .stat { display:flex; align-items:baseline; justify-content:space-between; padding-bottom:9px; border-bottom:1px solid var(--line); }
    .stat:last-child { border:0; padding:0; }.stat span { color:var(--muted); font-size:13px; }.stat strong { font-size:20px; }.green{color:var(--green)}.blue{color:var(--blue)}.orange{color:var(--orange)}
    .focus { padding:23px 24px; }.panel-heading { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; }.panel-heading h3{margin:0;font-size:16px}.panel-heading small{color:var(--muted);font-size:12px}
    .focus-list { display:grid; gap:13px; }.focus-item{display:grid;grid-template-columns:28px 1fr;gap:10px}.focus-num{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:var(--orange-soft);color:var(--orange);font-size:11px;font-weight:700}.focus-item strong{display:block;margin-bottom:4px;font-size:13px;line-height:1.4}.focus-item p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
    .timeline-panel { margin-bottom:18px; padding:21px 22px; overflow:hidden; }.timeline-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.timeline-head h3{margin:0 0 5px;font-size:16px}.timeline-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.timeline-note{color:var(--muted);font-size:11px;line-height:1.45;text-align:right}
    .timeline-scroller { overflow-x:auto; padding-bottom:4px; }.gantt { min-width:860px; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fcfcf8; }.gantt-head,.gantt-owner-row { display:grid; grid-template-columns:126px repeat(7,minmax(96px,1fr)); }.gantt-head{background:#f7f7f1;border-bottom:1px solid var(--line)}.gantt-corner{padding:11px 12px;color:var(--muted);font-size:11px;font-weight:600}.gantt-day{min-height:54px;padding:9px 10px;border-left:1px solid var(--line);font-size:12px}.gantt-day small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.gantt-day.today{background:var(--orange-soft);color:#9d551f}.gantt-owner-row{border-bottom:1px solid var(--line)}.gantt-owner-row:last-child{border-bottom:0}.gantt-owner{padding:15px 12px;background:#fafaf5;border-right:1px solid var(--line);font-size:13px;font-weight:700}.gantt-owner small{display:block;margin-top:4px;color:var(--muted);font-size:10px;font-weight:400}.gantt-lanes{grid-column:2/-1;display:grid;grid-template-columns:repeat(7,minmax(96px,1fr));grid-auto-rows:42px;min-height:42px;position:relative;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(14.285% - 1px),var(--line) calc(14.285% - 1px),var(--line) 14.285%)}
    .timeline-drop{grid-row:1/-1;min-height:100%;z-index:0}.timeline-drop.drag-over{background:rgba(232,120,44,.11);outline:2px dashed var(--orange);outline-offset:-3px}.task-bar{position:relative;z-index:1;align-self:center;height:31px;margin:0 4px;padding:0 20px 0 9px;border:1px solid #b8c9ef;border-radius:6px;background:var(--blue-soft);color:#365596;font-size:11px;font-weight:650;line-height:29px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;box-shadow:0 2px 5px rgba(43,74,139,.08)}.task-bar:active{cursor:grabbing}.task-bar.overdue{border-color:#efb4ac;background:var(--red-soft);color:#a7483f}.task-bar.done{border-color:#b9dfc8;background:var(--green-soft);color:#277852}.task-bar .resize{position:absolute;top:3px;right:3px;width:9px;height:23px;border-radius:3px;border-left:2px dotted currentColor;opacity:.6;cursor:ew-resize}.task-bar:hover .resize{opacity:1}.timeline-empty{grid-column:1/-1;align-self:center;padding-left:12px;color:var(--muted);font-size:11px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 16px}.segmented{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:9px;background:rgba(255,254,250,.65)}.segmented button{padding:8px 13px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:13px}.segmented button[aria-pressed=true]{background:var(--ink);color:#fff}.filter-note{color:var(--muted);font-size:13px}
    .tasks-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}.task-list{display:grid;gap:10px}.task-card{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;transition:.18s ease}.task-card:hover{border-color:#c7c7bd;box-shadow:0 8px 22px rgba(35,36,31,.06)}.task-main{display:grid;grid-template-columns:25px minmax(0,1fr) auto;gap:13px;align-items:start;padding:17px 18px 13px}.task-check{width:22px;height:22px;display:grid;place-items:center;border:1.5px solid #bfc0b7;border-radius:50%;background:transparent;color:transparent}.task-check.done{border-color:var(--green);background:var(--green);color:#fff}.task-title{margin:1px 0 8px;font-size:15px;line-height:1.4}.task-card.is-done .task-title{text-decoration:line-through;color:var(--muted)}.task-meta{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:4px 7px;border-radius:5px;font-size:11px;white-space:nowrap}.owner{background:#f1f1ec;color:#555850}.status-progress{background:var(--blue-soft);color:var(--blue)}.status-pending{background:#f1f1ec;color:#6c706a}.status-done{background:var(--green-soft);color:var(--green)}.priority-high{background:var(--red-soft);color:var(--red)}.priority-mid{background:var(--orange-soft);color:#a85d22}.task-due{text-align:right;color:var(--muted);font-size:12px;line-height:1.35}.task-due strong{display:block;margin-bottom:3px;color:var(--ink);font-size:12px}.task-due.overdue strong{color:var(--red)}.task-details{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px 16px 56px}.detail-label{margin-bottom:4px;color:var(--muted);font-size:11px}.detail-text{color:#4e514c;font-size:12px;line-height:1.55}.task-footer{display:flex;justify-content:space-between;gap:9px;padding:10px 17px;border-top:1px solid #eee;padding-left:56px;background:#fbfbf6}.text-btn{padding:4px 2px;border:0;background:transparent;color:var(--muted);font-size:12px}.text-btn:hover{color:var(--orange)}.task-footer-right{display:flex;gap:12px}
    .sidebar{display:grid;gap:18px}.side-panel{padding:21px}.people{display:grid;gap:10px}.person-row{display:grid;grid-template-columns:31px 1fr auto;gap:9px;align-items:center}.avatar{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:#e9e8e1;color:#444740;font-weight:700;font-size:12px}.person-row strong{display:block;font-size:13px}.person-row small{display:block;margin-top:2px;color:var(--muted);font-size:11px}.person-count{font-size:12px;font-weight:700}.mini-bar{height:4px;margin-top:6px;border-radius:6px;overflow:hidden;background:#e7e7df}.mini-bar i{display:block;height:100%;background:var(--green)}.people-actions{display:flex;justify-content:flex-end;margin-top:14px}.local-panel{border-color:#d6e0f7;background:var(--blue-soft);box-shadow:none}.local-panel h3,.local-panel p,.local-panel strong{color:#345799}.local-panel p{margin:0;font-size:12px;line-height:1.6}.local-panel strong{display:block;margin-top:11px;padding-top:10px;border-top:1px solid #cbd6f0;font-size:13px}
    dialog{width:min(620px,calc(100vw - 28px));padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 24px 70px rgba(20,21,19,.22)}dialog::backdrop{background:rgba(30,31,28,.3)}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:19px 21px;border-bottom:1px solid var(--line)}.dialog-head h3{margin:0;font-size:18px}.dialog-close{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1}.task-form,.member-form{padding:20px 21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field textarea{min-height:76px;resize:vertical}.dialog-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.dialog-actions-right{display:flex;gap:9px}.member-list{display:grid;gap:10px;margin-top:18px}.member-edit{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}.member-empty{padding:14px;border:1px dashed var(--line);color:var(--muted);font-size:12px;text-align:center}.toast{position:fixed;right:20px;bottom:20px;z-index:10;max-width:340px;padding:12px 15px;border:1px solid var(--line);border-radius:9px;background:var(--ink);color:#fff;box-shadow:var(--shadow);font-size:13px;opacity:0;transform:translateY(9px);pointer-events:none;transition:.2s ease}.toast.show{opacity:1;transform:translateY(0)}.empty{padding:36px 22px;border:1px dashed var(--line);border-radius:11px;text-align:center;color:var(--muted);font-size:13px}
    @media(max-width:980px){.overview,.tasks-layout{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.timeline-head{display:block}.week-actions{margin-top:13px}.timeline-note{text-align:left;margin-top:9px}}
    @media(max-width:680px){.shell{padding:24px 16px 40px}.topbar{display:block}.top-actions{margin-top:17px;justify-content:space-between}.hero{grid-template-columns:1fr;padding:21px}.progress-wrap{grid-template-columns:118px 1fr;gap:15px}.ring,.ring svg{width:118px;height:118px}.toolbar{display:block}.toolbar-actions{justify-content:space-between;margin-top:10px}.segmented{width:100%}.segmented button{flex:1;padding-left:8px;padding-right:8px}.timeline-panel{padding:18px 15px}.sidebar{grid-template-columns:1fr}.task-main{grid-template-columns:23px minmax(0,1fr)}.task-due{grid-column:2;text-align:left}.task-details{grid-template-columns:1fr;padding-left:55px}.task-footer{padding-left:18px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div><div class="eyebrow">WEEKLY WORKBENCH</div><h1>把本周，做成看得见的进度。</h1><p class="subtitle">直接编辑任务、安排时间，拖动时间条即可重新排期。无需登录，数据保存在当前浏览器。</p></div>
      <div class="top-actions"><span class="date-stamp" id="todayStamp"></span><button class="btn ghost" id="resetBtn" title="恢复初始示例">↻</button></div>
    </header>

    <section class="overview">
      <div class="panel hero"><div><div class="section-kicker">团队进度</div><h2 id="greeting">小义，今天先抓住两件事。</h2><p class="hero-copy" id="heroCopy"></p><div class="person-select"><label for="personSelect">当前查看</label><select id="personSelect"></select></div></div>
        <div class="progress-wrap"><div class="ring"><svg viewBox="0 0 142 142"><circle class="ring-bg" cx="71" cy="71" r="56"></circle><circle class="ring-value" id="ringValue" cx="71" cy="71" r="56" pathLength="100"></circle></svg><div class="ring-content"><strong id="progressPercent">0%</strong><span>完成进度</span></div></div><div class="stats"><div class="stat"><span>已完成</span><strong class="green" id="doneCount">0</strong></div><div class="stat"><span>进行中</span><strong class="blue" id="doingCount">0</strong></div><div class="stat"><span>待开始</span><strong class="orange" id="pendingCount">0</strong></div><div class="stat"><span>逾期</span><strong id="riskCount">0</strong></div></div></div>
      </div>
      <aside class="panel focus"><div class="panel-heading"><h3>今天的重点</h3><small>按截止时间排序</small></div><div class="focus-list" id="focusList"></div></aside>
    </section>

    <section class="panel timeline-panel">
      <div class="timeline-head"><div><h3>本周排期</h3><p>拖动任务条可移动到其他日期；拖动右侧小把手可延长或缩短排期。</p></div><div class="week-actions"><button class="btn ghost" id="prevWeek">←</button><button class="btn" id="thisWeek">本周</button><button class="btn ghost" id="nextWeek">→</button></div></div>
      <div class="timeline-note">任务跨天时会占用连续日期格；红色表示已逾期但尚未完成。</div><div class="timeline-scroller"><div class="gantt" id="gantt"></div></div>
    </section>

    <div class="toolbar"><div class="segmented" role="group"><button data-view="all" aria-pressed="true">全部任务</button><button data-view="active" aria-pressed="false">只看未完成</button><button data-view="priority" aria-pressed="false">重要任务</button></div><div class="toolbar-actions"><span class="filter-note" id="filterNote"></span><button class="btn primary" id="addTaskBtn">+ 新建任务</button></div></div>

    <section class="tasks-layout"><div class="task-list" id="taskList"></div><aside class="sidebar"><div class="panel side-panel"><div class="panel-heading"><h3>团队成员</h3><small>可直接管理</small></div><div class="people" id="peopleList"></div><div class="people-actions"><button class="btn" id="manageMembersBtn">管理成员</button></div></div><div class="panel side-panel local-panel"><div class="panel-heading"><h3>本地工作台</h3><small>无需登录</small></div><p>任务、成员和排期自动保存到当前浏览器。</p><strong>换设备或清除浏览器数据后不会保留。</strong></div></aside></section>
  </main>
  <dialog id="taskDialog"><div class="dialog-head"><h3 id="taskDialogTitle">编辑任务</h3><button class="dialog-close" data-close="taskDialog" aria-label="关闭">×</button></div><form class="task-form" id="taskForm"><input type="hidden" id="taskId"><div class="form-grid"><div class="field full"><label for="taskTitle">任务名称</label><input id="taskTitle" required maxlength="120"></div><div class="field"><label for="taskOwner">负责人</label><select id="taskOwner" required></select></div><div class="field"><label for="taskStatus">状态</label><select id="taskStatus"><option>待开始</option><option>进行中</option><option>已停滞</option><option>已完成</option></select></div><div class="field"><label for="taskStart">开始日期</label><input id="taskStart" type="date" required></div><div class="field"><label for="taskDue">截止日期</label><input id="taskDue" type="date" required></div><div class="field"><label for="taskProgress">完成进度</label><select id="taskProgress"><option value="0">0%</option><option value="25">25%</option><option value="50">50%</option><option value="75">75%</option><option value="100">100%</option></select></div><div class="field"><label for="taskPriority">优先级</label><select id="taskPriority"><option>重要紧急</option><option>重要不紧急</option><option>紧急不重要</option><option>不紧急不重要</option></select></div><div class="field full"><label for="taskUpdate">下一步 / 最新进展</label><textarea id="taskUpdate"></textarea></div><div class="field full"><label for="taskSummary">完成标准</label><textarea id="taskSummary"></textarea></div></div><div class="dialog-actions"><button type="button" class="btn danger" id="deleteTaskBtn">删除任务</button><div class="dialog-actions-right"><button type="button" class="btn" data-close="taskDialog">取消</button><button class="btn primary" type="submit">保存任务</button></div></div></form></dialog>
  <dialog id="memberDialog"><div class="dialog-head"><h3>管理团队成员</h3><button class="dialog-close" data-close="memberDialog" aria-label="关闭">×</button></div><div class="member-form"><div class="form-grid"><div class="field"><label for="newMemberName">新成员名称</label><input id="newMemberName" maxlength="20" placeholder="例如：小凌"></div><div class="field" style="align-self:end"><button class="btn primary" id="addMemberBtn" type="button">添加成员</button></div></div><div class="member-list" id="memberList"></div></div></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const STORE_KEY = 'weeklyWorkbenchV3';
    const dayMs = 86400000;
    const pad = value => String(value).padStart(2,'0');
    const isoDate = date => `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;
    const fromDate = value => { const [year,month,day] = value.split('-').map(Number); return new Date(year,month-1,day,12); };
    const addDays = (value, days) => { const date = fromDate(value); date.setDate(date.getDate()+days); return isoDate(date); };
    const diffDays = (start,end) => Math.max(0,Math.round((fromDate(end)-fromDate(start))/dayMs));
    const mondayOf = date => { const result = new Date(date.getFullYear(),date.getMonth(),date.getDate(),12); result.setDate(result.getDate()-((result.getDay()+6)%7)); return result; };
    const dateText = value => new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric'}).format(fromDate(value));
    const escapeHtml = value => String(value||'').replace(/[&<>"']/g,char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const uid = () => `task-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const $ = id => document.getElementById(id);
    const today = isoDate(new Date());
    const createSeed = () => { const start = isoDate(mondayOf(new Date())); return { members:['小义','小凌'], tasks:[
      {id:uid(),title:'完成 AI 配乐视频的剪辑与导出',owner:'小义',status:'进行中',priority:'重要紧急',start:addDays(start,0),due:addDays(start,2),progress:50,update:'完成粗剪和配乐节奏匹配，导出一版可确认成片。',summary:'输出一条可检查最终效果的 AI 配乐视频。'},
      {id:uid(),title:'完成一期新的文案初稿',owner:'小义',status:'待开始',priority:'重要紧急',start:addDays(start,1),due:addDays(start,3),progress:0,update:'确定选题和结构，完成初稿后做一轮精简。',summary:'形成可以进入下一步制作的文案版本。'},
      {id:uid(),title:'制作第 1 条常规视频精剪',owner:'小凌',status:'进行中',priority:'重要紧急',start:addDays(start,0),due:addDays(start,3),progress:50,update:'完成精剪、封面、标题和发布文案。',summary:'视频达到可发布状态，并准备好平台文案。'},
      {id:uid(),title:'建立中转站未来 5 天发布排期',owner:'小凌',status:'待开始',priority:'重要不紧急',start:addDays(start,2),due:addDays(start,5),progress:0,update:'整理可用素材，设置定时发布和发布检查清单。',summary:'未来 5 天均有可发布内容和对应文案。'}
    ]}; };
    const load = () => { try { const saved = JSON.parse(localStorage.getItem(STORE_KEY)); if (saved?.members?.length && Array.isArray(saved.tasks)) return saved; } catch {} return createSeed(); };
    let data = load();
    let viewWeek = mondayOf(new Date());
    const state = { person:'全部', view:'all', editingId:null, draggingId:null, resizing:null };
    const save = () => localStorage.setItem(STORE_KEY,JSON.stringify(data));
    const toast = message => { const node=$('toast'); node.textContent=message; node.classList.add('show'); clearTimeout(toast.timer); toast.timer=setTimeout(()=>node.classList.remove('show'),2500); };
    const isDone = task => task.status === '已完成' || Number(task.progress) === 100;
    const isOverdue = task => !isDone(task) && task.due < today;
    const progress = task => isDone(task) ? 100 : Number(task.progress)||0;
    const selectedTasks = () => data.tasks.filter(task => state.person === '全部' || task.owner === state.person);
    const visibleTasks = () => selectedTasks().filter(task => state.view === 'active' ? !isDone(task) : state.view === 'priority' ? task.priority === '重要紧急' : true);
    const ownerInitial = name => name.slice(0,1);
    const taskStatusClass = task => isDone(task) ? 'status-done' : task.status === '进行中' ? 'status-progress' : 'status-pending';
    const buildPersonSelect = () => { const selected = state.person; $('personSelect').innerHTML = `<option value="全部">全部成员</option>${data.members.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join('')}`; $('personSelect').value = data.members.includes(selected) || selected === '全部' ? selected : '全部'; state.person=$('personSelect').value; };
    function renderOverview(){ const list=selectedTasks(); const done=list.filter(isDone).length; const doing=list.filter(task=>!isDone(task)&&task.status==='进行中').length; const pending=list.filter(task=>!isDone(task)&&task.status!=='进行中').length; const risks=list.filter(isOverdue).length; const percent=list.length?Math.round(list.reduce((sum,task)=>sum+progress(task),0)/list.length):0; $('progressPercent').textContent=`${percent}%`; $('ringValue').style.strokeDasharray='100'; $('ringValue').style.strokeDashoffset=String(100-percent); $('doneCount').textContent=done; $('doingCount').textContent=doing; $('pendingCount').textContent=pending; $('riskCount').textContent=risks; const name=state.person==='全部'?'团队':state.person; $('greeting').textContent=`${name}，今天先抓住两件事。`; $('heroCopy').textContent=done?`已完成 ${done} 项；剩余任务集中在 ${doing} 项进行中和 ${pending} 项待开始。优先推进逾期和重要任务。`:'先把正在推进的任务落成一个可交付结果，再处理待开始任务。'; $('filterNote').textContent=`当前显示 ${visibleTasks().length} / ${list.length} 项`; }
    function renderFocus(){ const list=selectedTasks().filter(task=>!isDone(task)).sort((a,b)=>(Number(isOverdue(b))-Number(isOverdue(a)))||a.due.localeCompare(b.due)).slice(0,3); $('focusList').innerHTML=list.length?list.map((task,index)=>`<div class="focus-item"><span class="focus-num">0${index+1}</span><div><strong>${escapeHtml(task.title)}</strong><p>${isOverdue(task)?'已逾期 · ':''}${escapeHtml(task.update||'尚未设置下一步')}</p></div></div>`).join(''):'<div class="empty">当前没有未完成任务。</div>'; }
    const weekDates = () => Array.from({length:7},(_,index)=>isoDate(new Date(viewWeek.getFullYear(),viewWeek.getMonth(),viewWeek.getDate()+index,12)));
    const laneTasks = tasks => { const sorted=[...tasks].sort((a,b)=>a.start.localeCompare(b.start)||a.due.localeCompare(b.due)); const lanes=[]; sorted.forEach(task=>{ let lane=lanes.find(items=>!items.some(other=>!(task.due<other.start||task.start>other.due))); if(!lane){lane=[];lanes.push(lane)} lane.push(task); task._lane=lanes.indexOf(lane)+1; }); return {tasks:sorted,count:Math.max(1,lanes.length)}; };
    function renderTimeline(){ const days=weekDates(); const dayNames=['周一','周二','周三','周四','周五','周六','周日']; const header=`<div class="gantt-head"><div class="gantt-corner">负责人 / 任务</div>${days.map((day,index)=>`<div class="gantt-day ${day===today?'today':''}"><small>${dayNames[index]}${day===today?' · 今天':''}</small>${dateText(day)}</div>`).join('')}</div>`; const rows=data.members.map(owner=>{ const all=data.tasks.filter(task=>task.owner===owner); const {tasks,count}=laneTasks(all); const shown=tasks.filter(task=>task.due>=days[0]&&task.start<=days[6]); const drops=days.map(day=>`<div class="timeline-drop" data-drop-date="${day}"></div>`).join(''); const bars=shown.map(task=>{const start=Math.max(0,diffDays(days[0],task.start));const end=Math.min(6,diffDays(days[0],task.due));const classes=`${isOverdue(task)?'overdue':''} ${isDone(task)?'done':''}`;return `<div class="task-bar ${classes}" draggable="true" data-task-id="${task.id}" style="grid-column:${start+1}/${end+2};grid-row:${task._lane}"><span>${escapeHtml(task.title)}</span><i class="resize" data-resize-id="${task.id}" title="拖动调整截止日期"></i></div>`}).join(''); return `<div class="gantt-owner-row"><div class="gantt-owner">${escapeHtml(owner)}<small>${all.length} 项任务</small></div><div class="gantt-lanes" style="grid-template-rows:repeat(${count},42px)">${drops}${bars||'<span class="timeline-empty">本周暂无排期</span>'}</div></div>`; }).join(''); $('gantt').innerHTML=header+rows; }
    function renderTasks(){ const list=[...visibleTasks()].sort((a,b)=>Number(isDone(a))-Number(isDone(b))||Number(isOverdue(b))-Number(isOverdue(a))||a.due.localeCompare(b.due)); $('taskList').innerHTML=list.length?list.map(task=>`<article class="task-card ${isDone(task)?'is-done':''}"><div class="task-main"><button class="task-check ${isDone(task)?'done':''}" data-action="done" data-id="${task.id}" title="标记完成">${isDone(task)?'✓':'·'}</button><div><h3 class="task-title">${escapeHtml(task.title)}</h3><div class="task-meta"><span class="chip owner">${escapeHtml(task.owner)}</span><span class="chip ${taskStatusClass(task)}">${escapeHtml(isDone(task)?'已完成':task.status)}</span><span class="chip ${task.priority==='重要紧急'?'priority-high':'priority-mid'}">${escapeHtml(task.priority)}</span><span class="chip owner">${progress(task)}%</span></div></div><div class="task-due ${isOverdue(task)?'overdue':''}"><strong>${isOverdue(task)?'已逾期':'排期'}</strong>${dateText(task.start)} — ${dateText(task.due)}</div></div><div class="task-details"><div><div class="detail-label">下一步 / 最新进展</div><div class="detail-text">${escapeHtml(task.update||'暂无记录')}</div></div><div><div class="detail-label">完成标准</div><div class="detail-text">${escapeHtml(task.summary||'暂无记录')}</div></div></div><div class="task-footer"><button class="text-btn" data-action="edit" data-id="${task.id}">编辑任务与时间</button><div class="task-footer-right"><button class="text-btn" data-action="copy" data-id="${task.id}">复制下一步</button>${isDone(task)?'<span class="chip status-done">已完成</span>':`<button class="text-btn" data-action="done" data-id="${task.id}">标记完成</button>`}</div></div></article>`).join(''):'<div class="empty">没有符合当前筛选条件的任务。</div>'; }
    function renderPeople(){ $('peopleList').innerHTML=data.members.map(name=>{const list=data.tasks.filter(task=>task.owner===name);const done=list.filter(isDone).length;const percent=list.length?Math.round(list.reduce((sum,task)=>sum+progress(task),0)/list.length):0;return `<div class="person-row"><span class="avatar">${escapeHtml(ownerInitial(name))}</span><div><strong>${escapeHtml(name)}</strong><small>${done} / ${list.length} 项完成</small><div class="mini-bar"><i style="width:${percent}%"></i></div></div><span class="person-count">${percent}%</span></div>`}).join(''); }
    function render(){ buildPersonSelect(); renderOverview(); renderFocus(); renderTimeline(); renderTasks(); renderPeople(); }
    const getTask=id=>data.tasks.find(task=>task.id===id);
    function fillOwnerOptions(selected){ $('taskOwner').innerHTML=data.members.map(name=>`<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`).join(''); $('taskOwner').value=selected||data.members[0]; }
    function openTask(task){ state.editingId=task?.id||null; $('taskDialogTitle').textContent=task?'编辑任务':'新建任务'; $('deleteTaskBtn').style.visibility=task?'visible':'hidden'; $('taskId').value=task?.id||''; $('taskTitle').value=task?.title||''; fillOwnerOptions(task?.owner); $('taskStatus').value=task?.status||'待开始'; $('taskStart').value=task?.start||isoDate(viewWeek); $('taskDue').value=task?.due||isoDate(viewWeek); $('taskProgress').value=String(task?.progress??0); $('taskPriority').value=task?.priority||'重要紧急'; $('taskUpdate').value=task?.update||''; $('taskSummary').value=task?.summary||''; $('taskDialog').showModal(); }
    function openMembers(){ renderMemberList(); $('memberDialog').showModal(); }
    function renderMemberList(){ $('memberList').innerHTML=data.members.length?data.members.map(name=>`<div class="member-edit"><input value="${escapeHtml(name)}" data-member-original="${escapeHtml(name)}" maxlength="20" aria-label="成员名称"><button class="btn" data-member-save="${escapeHtml(name)}">保存</button><button class="btn danger" data-member-delete="${escapeHtml(name)}">删除</button></div>`).join(''):'<div class="member-empty">至少保留一位成员。</div>'; }
    function persist(message){ save(); render(); if(message)toast(message); }
    function moveTask(task,date){ const duration=diffDays(task.start,task.due); task.start=date; task.due=addDays(date,duration); persist('已更新任务排期'); }
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{state.view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));render();}));
    $('personSelect').addEventListener('change',event=>{state.person=event.target.value;render();});
    $('addTaskBtn').addEventListener('click',()=>openTask()); $('manageMembersBtn').addEventListener('click',openMembers);
    $('prevWeek').addEventListener('click',()=>{viewWeek=new Date(viewWeek.getFullYear(),viewWeek.getMonth(),viewWeek.getDate()-7,12);renderTimeline();}); $('nextWeek').addEventListener('click',()=>{viewWeek=new Date(viewWeek.getFullYear(),viewWeek.getMonth(),viewWeek.getDate()+7,12);renderTimeline();}); $('thisWeek').addEventListener('click',()=>{viewWeek=mondayOf(new Date());renderTimeline();});
    $('resetBtn').addEventListener('click',()=>{if(confirm('恢复为初始示例任务？当前浏览器里的修改会被清除。')){data=createSeed();state.person='全部';viewWeek=mondayOf(new Date());persist('已恢复初始示例');}});
    document.addEventListener('click',event=>{const close=event.target.closest('[data-close]');if(close)$(close.dataset.close).close();});
    $('taskForm').addEventListener('submit',event=>{event.preventDefault();const start=$('taskStart').value,due=$('taskDue').value;if(due<start){toast('截止日期不能早于开始日期');return;}const payload={id:$('taskId').value||uid(),title:$('taskTitle').value.trim(),owner:$('taskOwner').value,status:$('taskStatus').value,start,due,progress:Number($('taskProgress').value),priority:$('taskPriority').value,update:$('taskUpdate').value.trim(),summary:$('taskSummary').value.trim()};if(payload.status==='已完成')payload.progress=100;const index=data.tasks.findIndex(task=>task.id===payload.id);if(index>=0)data.tasks[index]=payload;else data.tasks.push(payload);$('taskDialog').close();persist(index>=0?'任务已保存':'任务已创建');});
    $('deleteTaskBtn').addEventListener('click',()=>{const task=getTask(state.editingId);if(task&&confirm(`删除「${task.title}」？`)){data.tasks=data.tasks.filter(item=>item.id!==task.id);$('taskDialog').close();persist('任务已删除');}});
    $('addMemberBtn').addEventListener('click',()=>{const name=$('newMemberName').value.trim();if(!name){toast('请输入成员名称');return;}if(data.members.includes(name)){toast('该成员已存在');return;}data.members.push(name);$('newMemberName').value='';save();renderMemberList();render();toast('成员已添加');});
    $('memberList').addEventListener('click',event=>{const saveButton=event.target.closest('[data-member-save]');const deleteButton=event.target.closest('[data-member-delete]');if(saveButton){const oldName=saveButton.dataset.memberSave;const input=document.querySelector(`[data-member-original="${CSS.escape(oldName)}"]`);const newName=input.value.trim();if(!newName||newName===oldName)return;if(data.members.includes(newName)){toast('该成员已存在');return;}data.members=data.members.map(name=>name===oldName?newName:name);data.tasks.forEach(task=>{if(task.owner===oldName)task.owner=newName});if(state.person===oldName)state.person=newName;save();renderMemberList();render();toast('成员名称已更新');}if(deleteButton){const name=deleteButton.dataset.memberDelete;if(data.members.length===1){toast('至少保留一位成员');return;}const replacement=data.members.find(item=>item!==name);if(confirm(`删除成员「${name}」？其任务将转交给「${replacement}」。`)){data.members=data.members.filter(item=>item!==name);data.tasks.forEach(task=>{if(task.owner===name)task.owner=replacement});if(state.person===name)state.person='全部';save();renderMemberList();render();toast('成员已删除，任务已转交');}}});
    $('taskList').addEventListener('click',async event=>{const button=event.target.closest('[data-action]');if(!button)return;const task=getTask(button.dataset.id);if(!task)return;if(button.dataset.action==='edit')openTask(task);if(button.dataset.action==='done'){const wasDone=isDone(task);task.status=wasDone?'待开始':'已完成';task.progress=wasDone?0:100;persist(wasDone?'任务已恢复':'任务已完成');}if(button.dataset.action==='copy'){try{await navigator.clipboard.writeText(task.update||'');toast('下一步已复制');}catch{toast('当前浏览器不支持自动复制');}}});
    $('gantt').addEventListener('dragstart',event=>{const bar=event.target.closest('.task-bar');if(!bar)return;state.draggingId=bar.dataset.taskId;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',state.draggingId);}); $('gantt').addEventListener('dragend',()=>{state.draggingId=null;document.querySelectorAll('.timeline-drop').forEach(node=>node.classList.remove('drag-over'));}); $('gantt').addEventListener('dragover',event=>{const drop=event.target.closest('.timeline-drop');if(!drop||!state.draggingId)return;event.preventDefault();drop.classList.add('drag-over');}); $('gantt').addEventListener('dragleave',event=>{event.target.closest('.timeline-drop')?.classList.remove('drag-over');}); $('gantt').addEventListener('drop',event=>{const drop=event.target.closest('.timeline-drop');if(!drop||!state.draggingId)return;event.preventDefault();const task=getTask(state.draggingId);if(task)moveTask(task,drop.dataset.dropDate);state.draggingId=null;});
    $('gantt').addEventListener('pointerdown',event=>{const handle=event.target.closest('[data-resize-id]');if(!handle)return;event.preventDefault();event.stopPropagation();const bar=handle.closest('.task-bar');state.resizing={id:handle.dataset.resizeId,startX:event.clientX,initialDue:getTask(handle.dataset.resizeId).due,bar};bar.setPointerCapture?.(event.pointerId);}); window.addEventListener('pointermove',event=>{if(!state.resizing)return;const grid=state.resizing.bar.closest('.gantt-lanes');const cellWidth=grid.getBoundingClientRect().width/7;const offset=Math.round((event.clientX-state.resizing.startX)/cellWidth);const task=getTask(state.resizing.id);const next=addDays(state.resizing.initialDue,offset);if(next>=task.start){task.due=next;renderTimeline();}});window.addEventListener('pointerup',()=>{if(!state.resizing)return;state.resizing=null;save();render();toast('已调整任务跨度');});
    $('todayStamp').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'short',month:'long',day:'numeric'}).format(new Date()); render();
  </script>
</body>
